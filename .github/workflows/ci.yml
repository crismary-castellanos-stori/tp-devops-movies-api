name: Go CI

on:
  # Run CI on direct updates to main and on pull requests targeting main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-docker:
    # Validate the application, binary build and Docker packaging.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
        
      # Pre-fetch Go modules before running the project commands.
      - name: Download dependencies
        run: go mod download

      # Run the unit test suite.
      - name: Run tests
        run: make test

       # Verify that the binary can be compiled successfully.
      - name: Build application
        run: make build

      # Validate that the Docker image can be built with the current source.
      - name: Build Docker image
        run: make docker-build
