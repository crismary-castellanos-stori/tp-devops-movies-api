name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build application
        run: make build

      - name: Build Docker image
        run: make docker-build
