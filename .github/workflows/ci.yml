name: CI/CD Pipeline

on:
  # Run CI on direct updates to main and on pull requests targeting main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    # Validate the application, binary build and Docker packaging.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
        
      # Pre-fetch Go modules before running the project commands.
      - name: Download dependencies
        run: go mod download

      # Run the unit test suite.
      - name: Run tests
        run: make test

       # Verify that the binary can be compiled successfully.
      - name: Build application
        run: make build

      # Validate that the Docker image can be built with the current source.
      - name: Build Docker image
        run: make docker-build

  publish:
    # Publish only after CI passes on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    env:
      IMAGE_NAME: movies-api
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Enable cross-platform emulation for multi-architecture builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Use Buildx to generate a multi-platform image manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate using repository secrets configured in GitHub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine the next semantic version from the merged change type.
      - name: Compute release version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_tag="$(git tag --points-at "${GITHUB_SHA}" 'v*' | sort -V | tail -n1)"
          if [ -n "${existing_tag}" ]; then
            echo "value=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_version="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "${base_version}" ]; then
            base_version="$(tr -d '[:space:]' < VERSION)"
          fi

          major="${base_version#v}"
          major="${major%%.*}"
          remainder="${base_version#v${major}.}"
          minor="${remainder%%.*}"
          patch="${base_version##*.}"

          pr_payload="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"

          pr_branch="$(printf '%s' "${pr_payload}" | jq -r '.[0].head.ref // ""')"
          pr_title="$(printf '%s' "${pr_payload}" | jq -r '.[0].title // ""')"
          head_message="${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}"

          change_hint="$(printf '%s\n%s\n%s' "${pr_branch}" "${pr_title}" "${head_message}" | tr '[:upper:]' '[:lower:]')"

          bump="patch"
          if printf '%s' "${change_hint}" | grep -Eq '(^|[[:space:]])feat[/(: -]'; then
            bump="minor"
          elif printf '%s' "${change_hint}" | grep -Eq '(^|[[:space:]])fix[/(: -]'; then
            bump="patch"
          fi

          if [ "${bump}" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          next_version="v${major}.${minor}.${patch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${next_version}" "${GITHUB_SHA}"
          git push origin "${next_version}"

          echo "value=${next_version}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Generate consistent tags and labels for the published image.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short,prefix=sha-

      # Reuse the same short SHA tag for the Render deploy hook payload.
      - name: Compute image tag for Render
        id: image_tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Publish a multi-architecture image so it can run on amd64 and arm64.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Ask Render to redeploy the exact image version that was just published.
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.sha_tag }}
        run: |
          curl --fail --silent --show-error \
            --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK_URL}"
