name: Docker Publish

on:
  # Publish images after changes are merged into main and allow manual retries.
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: movies-api

jobs:
  # Build and publish the production image to Docker Hub.
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable cross-platform emulation for multi-architecture builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Use Buildx to generate a multi-platform image manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate using repository secrets configured in GitHub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate consistent tags and labels for the published image.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Publish a multi-architecture image so it can run on amd64 and arm64.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
