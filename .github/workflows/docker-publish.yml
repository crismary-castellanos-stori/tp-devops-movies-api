name: Docker Publish

on:
  # Publish images after changes are merged into main and allow manual retries.
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: movies-api
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

jobs:
  # Build and publish the production image to Docker Hub.
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable cross-platform emulation for multi-architecture builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Use Buildx to generate a multi-platform image manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate using repository secrets configured in GitHub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Read the project version so the image can be published with a human-friendly tag.
      - name: Read release version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Generate consistent tags and labels for the published image.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short,prefix=sha-

      # Reuse the same short SHA tag for the Render deploy hook payload.
      - name: Compute image tag for Render
        id: image_tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Publish a multi-architecture image so it can run on amd64 and arm64.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Ask Render to redeploy the exact image version that was just published.
      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.sha_tag }}
        run: |
          curl --fail --silent --show-error \
            --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK_URL}"
